<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transsition</title>
</head>
<style>
    .box {
        width: 100px;
        height: 100px;
        border: 2px solid tomato;
        background-color: peachpuff;

         /* Property name| duration| easing function| delay 
        transition: width 5s linear 1s, background-color 5s;  */
        transition: transform 5s;
    }

    .box:hover {
        /* width: 400px;
        background-color: skyblue; */

        transform: rotate(45deg) scale(1.5) translateX(150px);
    }
</style>

<body>
    <ul>
        <li>Transform: Change the sape. This is a css style property name </li>
        <li>Translate: Is is a value of the transform style rule. THis means tou either move x or y or both</li>
        <li>Transition: how long it will take to do the change of the shape of color</li>
    </ul>
    <div class="box">box 1</div>
    <div class="box">box 2</div>
    <div class="box">box 3</div>
</body>

</html>
