<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event handler</title>
</head>
<body>
    <h1 id="page-title">Even Handler</h1>

    <button id="btn-update-title">Updae title</button>
    <p id="user-info">No user</p>
    <button id="btn-login">Login</button>
    <br><br>

    <!-- Handle input text -->
     <p id="name">No Name</p>
     <input id="input-name" placeholder="Your name" type="text">
     <button id="btn-update">Update</button>
    
    <script>
       //set eventlistener
       document.getElementById('btn-update')
        .addEventListener('click',function(){
            //get the text from input field
            const nameInput = document.getElementById('input-name');
            const name = nameInput.value;
            console.log('name: ', name);

            //set the name
            const nameP=document.getElementById('name');
            nameP.innerText=name;
        })
    </script>

    <script src="js/handler.js"></script>
</body>
</html>
