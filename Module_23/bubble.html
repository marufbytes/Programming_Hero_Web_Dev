<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bubble</title>
    <style>
        body {
            border: 2px solid red;
            margin: 2px;
        }

        section {
            border: 2px solid green;
            margin: 2px;
        }

        ol {
            border: 2px solid purple;
            margin: 2px;
        }

        li {
            border: 2px solid blue;
            margin: 2px;
        }
    </style>
</head>

<body id="body">
    <h1>Explore Event Bubble</h1>

    <section id="list-container">
        <h3>List of things</h3>
        <ol id="item-list">
            <li id="item-1">Lorem, ipsum.</li>
            <li id="item-2">Quaerat, et!</li>
            <li id="item-3">Accusamus, cum.</li>
            <li id="item-4">Et, repellendus!</li>
            <li id="item-5">Odit, nisi.</li>
            <li id="item-6">Ea, commodi.</li>
        </ol>
    </section>

    <script>
        document.getElementById('item-2')
            .addEventListener('click', function () {
                console.log('item 2 clicked');
                // event.stopPropagation()
                // event.stopImmediatePropagation()
            })
        document.getElementById('item-2')
            .addEventListener('click', function () {
                console.log('item 2 2nd clicked');
            })
        document.getElementById('item-2')
            .addEventListener('click', function () {
                console.log('item 2 3rd clicked');
            })
        document.getElementById('item-list')
            .addEventListener('click', function () {
                console.log('ol clicked');
            })
        document.getElementById('list-container')
            .addEventListener('click', function () {
                console.log('section clicked');
            })
        document.getElementById('body')
            .addEventListener('click', function () {
                console.log('body clicked');
            })
            
    </script>

</body>

</html>
